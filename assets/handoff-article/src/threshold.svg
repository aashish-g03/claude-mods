<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .bad { fill: #f47067; } .ok { fill: #3fb950; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: fill 10s linear infinite; }
      @keyframes fill { 0% { transform: scaleX(0) } 45% { transform: scaleX(0.16) } 47% { transform: scaleX(0.04) } 100% { transform: scaleX(0.12) } }
      .flash { opacity: 0; animation: flash 10s linear infinite; }
      @keyframes flash { 0%, 44% { opacity: 0 } 46%, 100% { opacity: 1 } }
      .band { opacity: 0; animation: band 10s linear infinite; }
      @keyframes band { 0%, 30% { opacity: 0 } 32%, 100% { opacity: 1 } }
    </style>
  </defs>
  <rect width="800" height="460" rx="18" fill="#0b0f14"/>
  <text x="28" y="46" class="s fg" font-size="24" font-weight="700">Bug 1: the button never appears</text>
  <text x="28" y="76" class="s dim" font-size="16">1M-token model, 200k compaction window: auto-compact at 16%</text>

  <text x="28" y="128" class="s bad" font-size="19" font-weight="700">✗ First version: button at 70%</text>
  <rect x="28" y="146" width="600" height="28" rx="7" fill="#21262d"/>
  <rect class="fill" x="28" y="146" width="600" height="28" rx="7" fill="#e3b341"/>
  <line x1="124" y1="138" x2="124" y2="182" stroke="#f47067" stroke-width="3"/>
  <text x="124" y="204" text-anchor="middle" class="m bad" font-size="15">compact 16%</text>
  <line x1="448" y1="138" x2="448" y2="182" stroke="#8b949e" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="448" y="204" text-anchor="middle" class="m dim" font-size="15">button 70%</text>
  <g class="flash"><text x="644" y="158" class="s bad" font-size="17" font-weight="700">compacted,</text>
    <text x="644" y="180" class="s bad" font-size="17">no button</text></g>

  <text x="28" y="270" class="s ok" font-size="19" font-weight="700">✓ Fixed: button 5 points before compaction</text>
  <rect x="28" y="288" width="600" height="28" rx="7" fill="#21262d"/>
  <rect class="fill" x="28" y="288" width="600" height="28" rx="7" fill="#e3b341"/>
  <line x1="94" y1="280" x2="94" y2="324" stroke="#3fb950" stroke-width="3"/>
  <text x="80" y="346" text-anchor="middle" class="m ok" font-size="15">11%</text>
  <line x1="124" y1="280" x2="124" y2="324" stroke="#f47067" stroke-width="3"/>
  <text x="138" y="346" text-anchor="middle" class="m bad" font-size="15">16%</text>
  <g class="band">
    <rect x="28" y="374" width="330" height="48" rx="9" fill="#0d1117" stroke="#30363d"/>
    <text x="46" y="405" class="m" font-size="18" fill="#e3b341">Context 11%</text>
    <rect x="180" y="384" width="110" height="30" rx="7" fill="#d97757"/>
    <text x="235" y="405" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#0d1117">Handoff</text>
  </g>
</svg>
