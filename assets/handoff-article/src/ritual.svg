<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .warn { fill: #e3b341; } .acc { fill: #f0a46f; } .bad { fill: #f47067; } .blue { fill: #79c0ff; }
      .f { opacity: 0; animation: 12s linear infinite; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; } .s5 { animation-name: s5; }
      @keyframes s1 { 0%, 19% { opacity: 1 } 20%, 100% { opacity: 0 } }
      @keyframes s2 { 0%, 19% { opacity: 0 } 20%, 39% { opacity: 1 } 40%, 100% { opacity: 0 } }
      @keyframes s3 { 0%, 39% { opacity: 0 } 40%, 59% { opacity: 1 } 60%, 100% { opacity: 0 } }
      @keyframes s4 { 0%, 59% { opacity: 0 } 60%, 79% { opacity: 1 } 80%, 100% { opacity: 0 } }
      @keyframes s5 { 0%, 79% { opacity: 0 } 80%, 100% { opacity: 1 } }
      .c { animation: 12s linear infinite; }
      .c2 { animation-name: c2; } .c3 { animation-name: c3; } .c4 { animation-name: c4; } .c5 { animation-name: c5; }
      @keyframes c2 { 0%, 19% { opacity: 0.3 } 20%, 100% { opacity: 1 } }
      @keyframes c3 { 0%, 39% { opacity: 0.3 } 40%, 100% { opacity: 1 } }
      @keyframes c4 { 0%, 59% { opacity: 0.3 } 60%, 100% { opacity: 1 } }
      @keyframes c5 { 0%, 79% { opacity: 0.3 } 80%, 100% { opacity: 1 } }
    </style>
  </defs>
  <rect width="800" height="420" rx="18" fill="#0b0f14"/>
  <text x="28" y="44" class="s fg" font-size="24" font-weight="700">The old ritual, every single time</text>

  <g class="s" font-size="16" font-weight="600">
    <g><rect x="28" y="66" width="132" height="34" rx="17" fill="#2d2213" stroke="#e3b341"/><text x="94" y="89" text-anchor="middle" class="warn">1 · 78% full</text></g>
    <g class="c c2"><rect x="170" y="66" width="120" height="34" rx="17" fill="#121d2f" stroke="#58a6ff"/><text x="230" y="89" text-anchor="middle" class="blue">2 · /export</text></g>
    <g class="c c3"><rect x="300" y="66" width="150" height="34" rx="17" fill="#121d2f" stroke="#58a6ff"/><text x="375" y="89" text-anchor="middle" class="blue">3 · new session</text></g>
    <g class="c c4"><rect x="460" y="66" width="164" height="34" rx="17" fill="#121d2f" stroke="#58a6ff"/><text x="542" y="89" text-anchor="middle" class="blue">4 · paste prompt</text></g>
    <g class="c c5"><rect x="634" y="66" width="138" height="34" rx="17" fill="#2a1717" stroke="#f47067"/><text x="703" y="89" text-anchor="middle" class="bad">5 · wait, hope</text></g>
  </g>

  <rect x="28" y="120" width="744" height="272" rx="12" fill="#0d1117" stroke="#30363d"/>

  <g class="f s1">
    <text x="52" y="168" class="m dim">● …two hours of decisions and</text>
    <text x="52" y="196" class="m dim">  half-answered questions…</text>
    <text x="52" y="356" class="s dim" font-size="16">context</text>
    <rect x="122" y="345" width="260" height="14" rx="7" fill="#21262d"/>
    <rect x="122" y="345" width="203" height="14" rx="7" fill="#e3b341"/>
    <text x="398" y="358" class="m warn" font-size="17">78% and climbing</text>
  </g>
  <g class="f s2">
    <text x="52" y="168" class="m fg"><tspan class="acc">❯</tspan> /export</text>
    <text x="52" y="206" class="m dim">Exported to 2026-10-26-0146….txt</text>
    <text x="52" y="234" class="m dim">(300 KB)</text>
  </g>
  <g class="f s3">
    <text x="52" y="168" class="m dim">$ claude</text>
    <text x="52" y="206" class="m fg">A fresh session. It knows nothing.</text>
  </g>
  <g class="f s4">
    <text x="52" y="168" class="m fg"><tspan class="acc">❯</tspan> I was working on this in another</text>
    <text x="72" y="196" class="m fg">session. Continue where I left off.</text>
    <text x="72" y="224" class="m fg">Answer every question we discussed.</text>
    <text x="72" y="252" class="m fg">Tell me what's pending.</text>
    <text x="72" y="280" class="m dim">Exported to 2026-10-26-0146….txt</text>
  </g>
  <g class="f s5">
    <text x="52" y="168" class="m dim">● Reading 2026-10-26-0146….txt</text>
    <text x="52" y="196" class="m dim">  300 KB, line by line…</text>
    <text x="52" y="246" class="m fg">Which parts mattered? It guesses.</text>
  </g>
</svg>
