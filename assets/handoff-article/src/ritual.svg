<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .warn { fill: #e3b341; } .acc { fill: #f0a46f; } .bad { fill: #f47067; }
      .f { opacity: 0; animation: 12s linear infinite; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; } .s5 { animation-name: s5; }
      @keyframes s1 { 0%, 22% { opacity: 1 } 24%, 100% { opacity: 0 } }
      @keyframes s2 { 0%, 22% { opacity: 0 } 24%, 40% { opacity: 1 } 42%, 100% { opacity: 0 } }
      @keyframes s3 { 0%, 40% { opacity: 0 } 42%, 58% { opacity: 1 } 60%, 100% { opacity: 0 } }
      @keyframes s4 { 0%, 58% { opacity: 0 } 60%, 78% { opacity: 1 } 80%, 100% { opacity: 0 } }
      @keyframes s5 { 0%, 78% { opacity: 0 } 80%, 100% { opacity: 1 } }
      .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; } .c4 { animation-name: c4; } .c5 { animation-name: c5; }
      @keyframes c1 { 0%, 100% { opacity: 1 } }
      @keyframes c2 { 0%, 22% { opacity: 0.25 } 24%, 100% { opacity: 1 } }
      @keyframes c3 { 0%, 40% { opacity: 0.25 } 42%, 100% { opacity: 1 } }
      @keyframes c4 { 0%, 58% { opacity: 0.25 } 60%, 100% { opacity: 1 } }
      @keyframes c5 { 0%, 78% { opacity: 0.25 } 80%, 100% { opacity: 1 } }
      .dots { animation: dots 1.2s steps(1) infinite; }
      @keyframes dots { 0% { opacity: 0.2 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0b0f14"/>
  <text x="48" y="58" class="sans fg" font-size="30" font-weight="700">The old ritual, every time the context filled up</text>

  <!-- Step chips -->
  <g class="sans" font-size="20">
    <g class="f c1"><rect x="48" y="84" width="196" height="40" rx="20" fill="#2d2213" stroke="#e3b341"/><text x="146" y="110" text-anchor="middle" class="warn">1 · notice 78%</text></g>
    <g class="f c2"><rect x="256" y="84" width="176" height="40" rx="20" fill="#1b2230" stroke="#58a6ff"/><text x="344" y="110" text-anchor="middle" fill="#79c0ff">2 · /export</text></g>
    <g class="f c3"><rect x="444" y="84" width="220" height="40" rx="20" fill="#1b2230" stroke="#58a6ff"/><text x="554" y="110" text-anchor="middle" fill="#79c0ff">3 · new session</text></g>
    <g class="f c4"><rect x="676" y="84" width="250" height="40" rx="20" fill="#1b2230" stroke="#58a6ff"/><text x="801" y="110" text-anchor="middle" fill="#79c0ff">4 · paste the prompt</text></g>
    <g class="f c5"><rect x="938" y="84" width="214" height="40" rx="20" fill="#2a1717" stroke="#f47067"/><text x="1045" y="110" text-anchor="middle" class="bad">5 · wait, hope</text></g>
  </g>

  <rect x="48" y="148" width="1104" height="364" rx="14" fill="#0d1117" stroke="#30363d"/>

  <g class="f s1">
    <text x="80" y="206" class="mono dim">● …two hours of work, decisions, half-answered questions…</text>
    <text x="80" y="246" class="mono dim">● Ran the e2e suite: 41 passed, 2 failed.</text>
    <text x="80" y="470" class="mono dim" font-size="20">context</text>
    <rect x="180" y="456" width="360" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="456" width="281" height="16" rx="8" fill="#e3b341"/>
    <text x="556" y="470" class="mono warn" font-size="20">78%  running out</text>
  </g>
  <g class="f s2">
    <text x="80" y="206" class="mono fg"><tspan class="acc">❯</tspan> /export</text>
    <text x="80" y="246" class="mono dim">Conversation exported to:</text>
    <text x="80" y="282" class="mono dim">  2026-10-26-014644-i-am-thinking-of-building….txt</text>
  </g>
  <g class="f s3">
    <text x="80" y="206" class="mono dim">$ claude</text>
    <text x="80" y="246" class="mono dim">A new session. It knows nothing.</text>
    <text x="80" y="470" class="mono dim" font-size="20">context</text>
    <rect x="180" y="456" width="360" height="16" rx="8" fill="#21262d"/>
    <rect x="180" y="456" width="14" height="16" rx="8" fill="#3fb950"/>
    <text x="556" y="470" class="mono dim" font-size="20">2%</text>
  </g>
  <g class="f s4">
    <text x="80" y="206" class="mono fg"><tspan class="acc">❯</tspan> I was working on this project in another session…</text>
    <text x="110" y="244" class="mono fg">continue from where I left off. Answer every question</text>
    <text x="110" y="282" class="mono fg">we discussed. Check skills. Tell me what's pending.</text>
    <text x="110" y="320" class="mono fg">Conversation exported to: 2026-10-26-…txt</text>
  </g>
  <g class="f s5">
    <text x="80" y="206" class="mono fg"><tspan class="acc">❯</tspan> I was working on this project in another session…</text>
    <text x="80" y="262" class="mono dim">● Reading 2026-10-26-…txt (300 KB)<tspan class="dots">…</tspan></text>
    <text x="80" y="310" class="mono dim">  Which parts mattered? It has to guess.</text>
  </g>
</svg>
