<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .h { fill: #f0a46f; font-weight: 700; } .ok { fill: #3fb950; } .open { fill: #e3b341; }
      .r { opacity: 0; animation: 12s linear infinite; }
      .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; } .r5 { animation-name: r5; } .r6 { animation-name: r6; }
      @keyframes r1 { 0%, 4% { opacity: 0 } 7%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r2 { 0%, 18% { opacity: 0 } 21%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r3 { 0%, 34% { opacity: 0 } 37%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r4 { 0%, 50% { opacity: 0 } 53%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r5 { 0%, 62% { opacity: 0 } 65%, 96% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r6 { 0%, 74% { opacity: 0 } 77%, 96% { opacity: 1 } 100% { opacity: 0 } }
      .shrink { transform-box: fill-box; transform-origin: left center; animation: shrink 12s ease-in-out infinite; }
      @keyframes shrink { 0%, 4% { transform: scaleX(1) } 80%, 100% { transform: scaleX(0.075) } }
    </style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#0b0f14"/>

  <!-- Left: the brief -->
  <rect x="40" y="40" width="800" height="560" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="68" y="80" class="mono dim" font-size="18">~/.claude/handoffs/my-app/2026-10-31-19-47-47/brief.md</text>
  <line x1="40" y1="96" x2="840" y2="96" stroke="#21262d"/>
  <g class="mono" font-size="21">
    <g class="r r1"><text x="68" y="138" class="h"># Task in progress</text>
      <text x="68" y="168" class="fg">Building the handoff mod. Next: live-test Start fresh.</text></g>
    <g class="r r2"><text x="68" y="218" class="h"># Questions raised and their status</text>
      <text x="68" y="248" class="fg">• Can a mod run /clear?  <tspan class="open">OPEN: needs one live press</tspan></text>
      <text x="68" y="276" class="fg">• Does /handoff write files?  <tspan class="ok">Yes, tested live</tspan></text></g>
    <g class="r r3"><text x="68" y="326" class="h"># Pending</text>
      <text x="68" y="356" class="fg">- [ ] Live-test Start fresh</text>
      <text x="68" y="384" class="fg">- [ ] Install for every project</text></g>
    <g class="r r4"><text x="68" y="434" class="h"># Decisions</text>
      <text x="68" y="464" class="fg">Transcript saved first, so it survives a failed brief.</text></g>
    <g class="r r5"><text x="68" y="514" class="h"># Gotchas</text>
      <text x="68" y="544" class="fg">A policy plugin skips prompt.compose for personal mods.</text></g>
    <g class="r r6"><text x="68" y="584" class="h"># Skills and memories: <tspan class="fg" font-weight="400">plugin-authoring</tspan></text></g>
  </g>

  <!-- Right: size -->
  <text x="880" y="128" class="sans fg" font-size="26" font-weight="700">What the next</text>
  <text x="880" y="160" class="sans fg" font-size="26" font-weight="700">session reads</text>
  <text x="880" y="230" class="sans dim" font-size="20">full transcript</text>
  <rect x="880" y="244" width="270" height="26" rx="6" fill="#30363d"/>
  <text x="880" y="300" class="mono dim" font-size="20">212 KB</text>
  <text x="880" y="370" class="sans dim" font-size="20">the brief</text>
  <rect class="shrink" x="880" y="384" width="270" height="26" rx="6" fill="#d97757"/>
  <text x="880" y="440" class="mono" font-size="20" fill="#f0a46f">16 KB · about 4k tokens</text>
  <text x="880" y="520" class="sans dim" font-size="19">Full transcript stays on</text>
  <text x="880" y="546" class="sans dim" font-size="19">disk for any missing detail.</text>
</svg>
