<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .h { fill: #f0a46f; font-weight: 700; } .ok { fill: #3fb950; } .open { fill: #e3b341; }
      .r { opacity: 0; animation: 12s linear infinite; }
      .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; } .r5 { animation-name: r5; }
      @keyframes r1 { 0%, 3% { opacity: 0 } 5%, 100% { opacity: 1 } }
      @keyframes r2 { 0%, 17% { opacity: 0 } 19%, 100% { opacity: 1 } }
      @keyframes r3 { 0%, 33% { opacity: 0 } 35%, 100% { opacity: 1 } }
      @keyframes r4 { 0%, 49% { opacity: 0 } 51%, 100% { opacity: 1 } }
      @keyframes r5 { 0%, 63% { opacity: 0 } 65%, 100% { opacity: 1 } }
      .shrink { transform-box: fill-box; transform-origin: left center; animation: shrink 12s ease-in-out infinite; }
      @keyframes shrink { 0%, 5% { transform: scaleX(1) } 75%, 100% { transform: scaleX(0.075) } }
    </style>
  </defs>
  <rect width="800" height="520" rx="18" fill="#0b0f14"/>
  <rect x="20" y="20" width="760" height="376" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="50" class="m dim" font-size="15">~/.claude/handoffs/my-app/…/brief.md</text>
  <line x1="20" y1="64" x2="780" y2="64" stroke="#21262d"/>

  <g class="r r1"><text x="40" y="98" class="m h"># Task in progress</text>
    <text x="40" y="124" class="m fg">Building the handoff mod. Next: test Start fresh.</text></g>
  <g class="r r2"><text x="40" y="164" class="m h"># Questions and their status</text>
    <text x="40" y="190" class="m fg">• Can a mod run /clear? <tspan class="open">OPEN</tspan></text>
    <text x="40" y="214" class="m fg">• Does /handoff write files? <tspan class="ok">Yes, tested</tspan></text></g>
  <g class="r r3"><text x="40" y="254" class="m h"># Pending</text>
    <text x="40" y="280" class="m fg">- [ ] Live-test Start fresh</text>
    <text x="40" y="304" class="m fg">- [ ] Install for every project</text></g>
  <g class="r r4"><text x="40" y="344" class="m h"># Decisions · Gotchas · Skills</text>
    <text x="40" y="370" class="m fg">Save the transcript first. Avoid prompt.compose.</text></g>

  <!-- Size comparison -->
  <g class="s" font-size="16">
    <text x="20" y="434" class="dim">full transcript</text>
    <rect x="150" y="421" width="480" height="18" rx="5" fill="#3d444d"/>
    <text x="644" y="435" class="m dim" font-size="16">212 KB</text>
    <text x="20" y="478" class="fg" font-weight="600">the brief</text>
    <rect class="shrink" x="150" y="465" width="480" height="18" rx="5" fill="#d97757"/>
    <g class="r r5"><text x="200" y="479" class="m acc" font-size="16" fill="#f0a46f">16 KB · about 4,000 tokens</text></g>
  </g>
</svg>
