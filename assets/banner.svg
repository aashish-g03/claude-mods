<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">handoff, a Claude Code mod</title>
  <desc id="d">A terminal loop: at 72% context a Handoff button appears, the handoff is written and saved, /clear runs, and the next conversation resumes from the brief by itself.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a46f"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .fg { fill: #e6edf3; } .dim { fill: #8b949e; } .warn { fill: #e3b341; } .ok { fill: #3fb950; } .acc { fill: #f0a46f; }
      .b { font-weight: 700; }
      .f { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .f1 { animation-name: k1; } .f2 { animation-name: k2; } .f3 { animation-name: k3; } .f4 { animation-name: k4; } .f5 { animation-name: k5; }
      .before { animation-name: before; } .after { animation-name: after; }
      @keyframes k1 { 0%, 19% { opacity: 1 } 21%, 100% { opacity: 0 } }
      @keyframes k2 { 0%, 19% { opacity: 0 } 21%, 33% { opacity: 1 } 35%, 100% { opacity: 0 } }
      @keyframes k3 { 0%, 33% { opacity: 0 } 35%, 54% { opacity: 1 } 56%, 100% { opacity: 0 } }
      @keyframes k4 { 0%, 54% { opacity: 0 } 56%, 70% { opacity: 1 } 72%, 100% { opacity: 0 } }
      @keyframes k5 { 0%, 70% { opacity: 0 } 72%, 98% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes before { 0%, 54% { opacity: 1 } 56%, 100% { opacity: 0 } }
      @keyframes after { 0%, 54% { opacity: 0 } 56%, 98% { opacity: 1 } 100% { opacity: 0 } }
      .meter { transform-box: fill-box; transform-origin: left center; animation: meter 14s infinite; }
      @keyframes meter { 0% { transform: scaleX(0.55) } 14% { transform: scaleX(0.72) } 54% { transform: scaleX(0.72) } 56% { transform: scaleX(0.04) } 98% { transform: scaleX(0.09) } 100% { transform: scaleX(0.55) } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .f, .meter, .caret, .before, .after { animation: none; }
        .f3, .before { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="600" rx="24" fill="url(#bg)"/>

  <!-- Title -->
  <text x="64" y="58" class="sans acc b" font-size="17" letter-spacing="2">A CLAUDE CODE MOD</text>
  <text x="62" y="114" class="sans fg b" font-size="58">handoff</text>
  <rect x="64" y="128" width="96" height="4" rx="2" fill="url(#glow)"/>
  <text x="300" y="98" class="sans dim" font-size="23">One button at 70% context.</text>
  <text x="300" y="128" class="sans fg" font-size="23">The next session picks up exactly where you left off.</text>

  <!-- Terminal -->
  <rect x="64" y="166" width="1152" height="396" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="92" cy="190" r="7" fill="#ff5f57"/><circle cx="114" cy="190" r="7" fill="#febc2e"/><circle cx="136" cy="190" r="7" fill="#28c840"/>
  <text x="640" y="196" text-anchor="middle" class="mono dim" font-size="15">claude · ~/projects/my-app</text>
  <line x1="64" y1="210" x2="1216" y2="210" stroke="#21262d"/>

  <!-- Conversation before the handoff -->
  <g class="f before">
    <text x="96" y="252" class="mono fg"><tspan class="acc">❯</tspan> migrate the auth middleware to the new session API</text>
    <text x="96" y="288" class="mono dim">● Updated middleware/session.ts and 14 call sites.</text>
    <text x="120" y="318" class="mono dim">Two routes still read the old cookie; tests for them are next.</text>
    <text x="96" y="354" class="mono dim">● Ran the e2e suite: 41 passed, 2 failed (both on the old cookie).</text>
  </g>

  <!-- Conversation after /clear -->
  <g class="f after">
    <text x="96" y="252" class="mono fg"><tspan class="acc">❯</tspan> /clear</text>
    <text x="96" y="288" class="mono dim"><tspan class="acc">❯</tspan> Resume from my handoff of 31 Oct, 7:47 pm. Read the brief first…</text>
    <text x="120" y="316" class="mono dim" font-size="15">↳ sent by the mod, nothing typed</text>
  </g>
  <g class="f f5">
    <text x="96" y="358" class="mono fg">● Read brief.md. Where it stands: middleware migrated, 2 routes left.</text>
    <text x="120" y="388" class="mono fg">Open questions (1) · Pending (8). Waiting for you before I start.</text>
  </g>

  <!-- Band above the prompt, one state per frame -->
  <g class="f f1">
    <text x="96" y="452" class="mono warn">Context 72%</text>
    <rect x="236" y="430" width="128" height="30" rx="6" fill="#d97757"/>
    <text x="300" y="451" text-anchor="middle" class="mono b" fill="#0d1117">Handoff</text>
    <rect x="378" y="430" width="92" height="30" rx="6" fill="none" stroke="#30363d"/>
    <text x="424" y="451" text-anchor="middle" class="mono dim">Later</text>
  </g>
  <g class="f f2">
    <text x="96" y="452" class="mono dim">Writing handoff…  transcript.md ✓  brief.md …</text>
  </g>
  <g class="f f3">
    <text x="96" y="452" class="mono ok">Handoff saved · 8 pending</text>
    <rect x="390" y="430" width="160" height="30" rx="6" fill="#d97757"/>
    <text x="470" y="451" text-anchor="middle" class="mono b" fill="#0d1117">Start fresh</text>
    <rect x="564" y="430" width="108" height="30" rx="6" fill="none" stroke="#30363d"/>
    <text x="618" y="451" text-anchor="middle" class="mono dim">Dismiss</text>
  </g>
  <g class="f f4">
    <text x="96" y="452" class="mono dim">Resuming from handoff · 31 Oct, 7:47 pm · 8 pending…</text>
  </g>
  <g class="f f5">
    <text x="96" y="452" class="mono ok">Resumed from handoff · 31 Oct, 7:47 pm · 8 pending</text>
  </g>

  <!-- Prompt and status line -->
  <line x1="88" y1="474" x2="1192" y2="474" stroke="#21262d"/>
  <text x="96" y="504" class="mono acc">❯ <tspan class="caret fg">▍</tspan></text>
  <line x1="88" y1="518" x2="1192" y2="518" stroke="#21262d"/>
  <text x="96" y="546" class="mono dim" font-size="16">~/projects/my-app  │  context</text>
  <rect x="422" y="534" width="200" height="12" rx="6" fill="#21262d"/>
  <rect class="meter" x="422" y="534" width="200" height="12" rx="6" fill="url(#glow)"/>
  <g class="f before"><text x="638" y="546" class="mono warn" font-size="16">72%</text></g>
  <g class="f after"><text x="638" y="546" class="mono dim" font-size="16">9%</text></g>
</svg>
